<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovAI - Assistant IA</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
                        <rect width="40" height="40" rx="10" fill="url(#sb-grad)"/>
                        <path d="M12 20C12 15 16 11 20 11C24 11 28 15 28 20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M16 24C16 21 18 19 20 19C22 19 24 21 24 24" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                        <circle cx="20" cy="28" r="2" fill="white"/>
                        <defs>
                            <linearGradient id="sb-grad" x1="0" y1="0" x2="40" y2="40">
                                <stop stop-color="#6366f1"/>
                                <stop offset="1" stop-color="#8b5cf6"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <span>NovAI</span>
                </div>
                <button id="newConvBtn" class="btn-new-conv" title="Nouvelle conversation">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                </button>
            </div>
            <div class="conv-list" id="convList"></div>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-info-left">
                        <div class="user-avatar-small" id="userAvatarSmall"></div>
                        <span id="usernameDisplay"></span>
                    </div>
                    <button id="logoutBtn" class="btn-logout" title="Deconnexion">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Overlay mobile -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Chat -->
        <main class="chat-container">
            <header class="chat-header">
                <button id="toggleSidebar" class="btn-toggle-sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <div class="header-center">
                    <span class="header-title">NovAI</span>
                    <span class="header-model">Mistral via Ollama</span>
                </div>
                <div class="header-actions">
                    <button id="exportBtn" class="btn-icon" title="Exporter la conversation">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    </button>
                </div>
            </header>

            <div class="chat-messages" id="chatMessages">
                <div class="welcome-section">
                    <div class="welcome-avatar">
                        <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
                            <path d="M12 20C12 15 16 11 20 11C24 11 28 15 28 20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                            <path d="M16 24C16 21 18 19 20 19C22 19 24 21 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                            <circle cx="20" cy="28" r="2" fill="currentColor"/>
                        </svg>
                    </div>
                    <h2>Comment puis-je vous aider ?</h2>
                    <p>Posez une question, demandez de l'aide sur du code, ou discutons simplement.</p>
                    <div class="suggestions" id="suggestions">
                        <button class="suggestion-card" data-prompt="Explique-moi comment fonctionne une API REST">
                            <div class="suggestion-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                            </div>
                            <span>Explique-moi les API REST</span>
                        </button>
                        <button class="suggestion-card" data-prompt="Aide-moi a organiser ma journee de travail efficacement">
                            <div class="suggestion-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                            </div>
                            <span>Organiser ma journee</span>
                        </button>
                        <button class="suggestion-card" data-prompt="Ecris un script Python pour lire un fichier CSV et afficher des statistiques">
                            <div class="suggestion-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                            </div>
                            <span>Script Python pour CSV</span>
                        </button>
                        <button class="suggestion-card" data-prompt="Quelles sont les meilleures pratiques en securite web ?">
                            <div class="suggestion-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                            </div>
                            <span>Securite web</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="chat-input-wrapper">
                <form class="chat-input" id="chatForm">
                    <textarea
                        id="userInput"
                        placeholder="Ecrivez votre message..."
                        rows="1"
                        required
                    ></textarea>
                    <button type="submit" id="sendBtn" title="Envoyer">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                </form>
                <p class="input-hint">NovAI peut faire des erreurs. Verifiez les informations importantes.</p>
            </div>
        </main>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
